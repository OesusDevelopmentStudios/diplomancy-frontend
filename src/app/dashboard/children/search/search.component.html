<div class="container" [class.show]="showSearch()">
    <div class="header_nav">
        <img class="img_button" src="assets/cancel.png" (click)="close()"/>
    </div>
    <div class="search_bar">
        <div class="main_options">
            <input type="text" placeholder="{{ 'dashboard.search.search_hint' | translate }}"/>
            <label for="game_mode">{{ 'dashboard.search.mode' | translate }}</label>
            <select id="game_mode">
                <option value="all"> ALL </option>
                <option value="ww1"> WW1 </option>
            </select>
            <label for="country_available">{{ 'dashboard.search.countries' | translate}}</label>
            <select id="country_available">
                <option value="all"> ALL </option>
                <option value="ww1"> WW1 </option>
            </select>
        </div>
        <div class="advanced_options">
            <app-checkbox> {{ 'dashboard.search.password' | translate }} </app-checkbox>
            <app-checkbox> {{ 'dashboard.search.hot_join' | translate }} </app-checkbox>
            <app-checkbox> {{ 'dashboard.search.friends' | translate }} </app-checkbox>
        </div>
    </div>
</div>
<div class="backdrop" [class.show]="showSearch()"></div>
