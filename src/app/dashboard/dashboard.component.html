<main>
    <div class="titlebar">
        <h1>Diplomancy</h1>
        <div class="buttons_wrapper">
            <img class="img_button" src="assets/pl.png" (click)="changeLanguage('pl')"/>
            <div class="btn_spacer"></div>
            <img class="img_button" src="assets/uk.png"(click)="changeLanguage('en')"/>
            <div class="btn_spacer"></div>
            <img class="img_button" src="assets/settings.png" (click)="manageSettings()"/>
        </div>
    </div>
    <div class="content">
        <div class="game_view">
            <div class="main_control">
                <div>
                    New Game
                </div>
                <div>
                    Search for games
                </div>
            </div>
        </div>
        <app-sidebar/>
        </div>
    <app-settings [(settingsOpen)]="showSettings"/>
</main>
